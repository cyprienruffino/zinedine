[project]
name = "soccer-rl"
version = "0.1.0"
description = "Reinforcement-learning environment for Soccer Physics, via a BepInEx plugin"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]

[project.optional-dependencies]
train = ["stable-baselines3>=2.3", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soccer_rl"]
